name: Build Osmosfeed Feeds

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u niklaskunstleben-lab --password-stdin

      - name: Reset docs folder
        run: |
          rm -rf docs
          mkdir docs

      - name: Build ITC Changes
        run: |
          docker run --rm -v ${PWD}:/app ghcr.io/osmoscraft/osmosfeed:latest \
            build --config feeds/changes/osmosfeed.json --output docs/changes

      - name: Build ITC Blog
        run: |
          docker run --rm -v ${PWD}:/app ghcr.io/osmoscraft/osmosfeed:latest \
            build --config feeds/blog/osmosfeed.json --output docs/blog

      - name: Build ITC Incidents
        run: |
          docker run --rm -v ${PWD}:/app ghcr.io/osmoscraft/osmosfeed:latest \
            build --config feeds/incidents/osmosfeed.json --output docs/incidents

      - name: Verify build output
        run: ls -R docs || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
