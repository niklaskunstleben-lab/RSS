name: Build Osmosfeed

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build ITC Changes
        run: npx osmosfeed build --config feeds/changes/osmosfeed.json --output docs/changes

      - name: Build ITC Blog
        run: npx osmosfeed build --config feeds/blog/osmosfeed.json --output docs/blog

      - name: Build ITC Incidents
        run: npx osmosfeed build --config feeds/incidents/osmosfeed.json --output docs/incidents

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
