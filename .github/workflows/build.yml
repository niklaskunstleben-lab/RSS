name: Build Osmosfeed Feeds

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure docs folder exists
        run: mkdir -p docs

      - name: Build ITC Changes
        run: |
          npx ghcr.io/osmoscraft/osmosfeed:latest \
            build --config feeds/changes/osmosfeed.json --output docs/changes

      - name: Build ITC Blog
        run: |
          npx ghcr.io/osmoscraft/osmosfeed:latest \
            build --config feeds/blog/osmosfeed.json --output docs/blog

      - name: Build ITC Incidents
        run: |
          npx ghcr.io/osmoscraft/osmosfeed:latest \
            build --config feeds/incidents/osmosfeed.json --output docs/incidents

      - name: Verify build output
        run: |
          echo "Docs content:"
          ls -R docs || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
