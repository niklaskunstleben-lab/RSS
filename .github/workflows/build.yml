name: Build Osmosfeed Feeds

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Changes Feed
        run: npx ghcr.io/osmoscraft/osmosfeed:latest \
              build --config feeds/changes/osmosfeed.json \
              --output docs/changes

      - name: Build Blog Feed
        run: npx ghcr.io/osmoscraft/osmosfeed:latest \
              build --config feeds/blog/osmosfeed.json \
              --output docs/blog

      - name: Build Incidents Feed
        run: npx ghcr.io/osmoscraft/osmosfeed:latest \
              build --config feeds/incidents/osmosfeed.json \
              --output docs/incidents

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/deploy-pages@v4
        with: {}
